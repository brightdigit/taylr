coverage:
  status:
    # Informational only: uploads stay for the PR comment/UI, but patch/project
    # must not fail checks (incomplete mid-run uploads are pure noise).
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

flags:
  ubuntu:
    paths:
      - Packages/{{TEMPLATE_PACKAGE_NAME}}/Sources/
  windows:
    paths:
      - Packages/{{TEMPLATE_PACKAGE_NAME}}/Sources/
  macos:
    paths:
      - Packages/{{TEMPLATE_PACKAGE_NAME}}/Sources/

ignore:
  - "Packages/{{TEMPLATE_PACKAGE_NAME}}/Tests/**"
  - "**/Package.swift"
  - "Project.swift"
  - "Tuist/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
