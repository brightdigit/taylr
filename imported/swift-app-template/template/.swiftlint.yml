custom_rules:
  no_global_declarations:
    name: "No Global Declarations"
    message: "Declare this inside a type (enum/struct namespace or extension) — globals \
      bypass access-control scoping and can't be discovered from the type they relate to."
    regex: '^(public |package |internal |private |fileprivate )?(func|let|var)\s+[a-zA-Z_]'
    # NOTE: deliberately no `match_kinds:` — on SwiftLint 0.63.2 it silently suppresses
    # every match here (verified against all of [keyword], [identifier], and both),
    # because the matched range spans several syntax kinds and the filter requires all
    # of them to be listed. The `^`-anchored regex is precise enough without it: type
    # members are always indented under `indentation_width: 2`.
    #
    # SwiftPM/Tuist manifests require a top-level `let package`/`let project` and carry
    # an inline `swiftlint:disable:next no_global_declarations`.
    severity: error
cyclomatic_complexity:
  - 6
  - 8
type_body_length:
  - 125
  - 200
file_length:
  - 275
  - 300
function_body_length:
  - 35
  - 50
function_parameter_count: 8
line_length:
  - 90
  - 90
identifier_name:
  excluded:
    - id
    - db
excluded:
  - DerivedData
  - .build
  - .swiftpm
  - "*/.swiftpm"
  # Vendored fastlane snapshot helper — kept verbatim, exempt from lint.
  - "UITests/SnapshotHelper.swift"
  - "*/.build"
indentation_width:
