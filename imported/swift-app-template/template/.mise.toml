# mise configuration for {{TEMPLATE_APP_NAME}} production infrastructure
# Documentation: https://mise.jdx.dev/configuration.html

[tools]
tuist = "4.145.0"             # Xcode project generator
ruby = "3.3.7"                # Ruby runtime for fastlane
swiftlint = "0.63.2"          # Swift style and conventions checking
"spm:swiftlang/swift-format" = "602.0.0"  # Apple's Swift code formatting

# Enable experimental features (required for spm backend)
[settings]
experimental = true

# Optional: Uncomment to set defaults
# DEVELOPER_DIR = "/Applications/Xcode.app"
